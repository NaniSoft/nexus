<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Nexus mark: the agent loop, three stages on one cycle. The bright node is
       the stage a build is at; the loop never skips a stage. Colours are the
       cyan pack's own tokens (brand-100, brand-400, neutral-950). -->
  <rect width="32" height="32" rx="4" fill="#15191A" />
  <g fill="none" stroke="#46BCD6" stroke-width="2.4" stroke-linecap="round">
    <path d="M17.5 10.1 L22 17.9" />
    <path d="M20.5 20.5 L11.5 20.5" />
    <path d="M10 17.9 L14.5 10.1" />
  </g>
  <circle cx="16" cy="7.5" r="2.8" fill="#CDF5FF" />
  <circle cx="23.5" cy="20.5" r="2.6" fill="#15191A" stroke="#46BCD6" stroke-width="1.6" />
  <circle cx="8.5" cy="20.5" r="2.6" fill="#15191A" stroke="#46BCD6" stroke-width="1.6" />
</svg>
