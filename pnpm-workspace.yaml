# Config-only — this is a flat single-app repo, not a pnpm workspace.
# Dependency-build policy, mirroring the prism repo: neither package needs its
# postinstall (esbuild's platform binary arrives via optionalDependencies;
# wrangler deploy/config never needs workerd — wrangler dev is unused here,
# static assets + remote preview).
allowBuilds:
  esbuild: false
  workerd: false
# First-party prism packages are excluded from the release-age policy: they are
# ours, resolved from npm by exact version in the lockfile, and fresh releases are
# precisely what this repo wants to pick up.
#
# A SCOPE, and no version. The policy exists to slow a compromised package down,
# and our own packages are the one set where waiting buys nothing: a delay here
# means this repository is on an older line than the three sites beside it, which
# is the split this programme spent a release undoing. Naming versions here would
# also be a second declaration of a number another repository owns, so a scope is
# both the smaller rule and the honest one: it says "ours are exempt" and states
# nothing about which of ours.
#
# The token package is not named and is not declared, because the component
# package declares it at an exact version and brings it with it. A consumer cannot
# be handed a mismatched pair, and there is nothing here to keep in step.
minimumReleaseAgeExclude:
  - '@nanisoft/*'
